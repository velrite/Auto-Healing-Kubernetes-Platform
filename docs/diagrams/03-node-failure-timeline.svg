<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" width="900" height="250" font-family="Arial,Helvetica,sans-serif" font-size="14"><rect width="100%" height="100%" fill="#ffffff"/><defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#444"/></marker></defs><text x="450" y="30" text-anchor="middle" font-size="16" fill="#111" font-weight="bold">Node failure: where the 361 s went</text><line x1="60" y1="130" x2="840" y2="130" stroke="#444" stroke-width="2"/><rect x="146" y="112" width="648" height="36" fill="#fde7c8" stroke="#e08a00"/><text x="470" y="135" text-anchor="middle" font-size="13" fill="#111">pods tolerate the not-ready taint (300 s default)</text><circle cx="60" cy="130" r="6" fill="#3b6fd4"/><text x="95" y="80" text-anchor="middle" font-size="14" fill="#111" font-weight="bold">t = 0</text><text x="95" y="98" text-anchor="middle" font-size="13" fill="#111">worker m02 stopped</text><circle cx="146" cy="130" r="6" fill="#3b6fd4"/><text x="146" y="190" text-anchor="middle" font-size="14" fill="#111" font-weight="bold">about 40 s</text><text x="146" y="208" text-anchor="middle" font-size="13" fill="#111">node marked NotReady</text><circle cx="794" cy="130" r="6" fill="#3b6fd4"/><text x="794" y="80" text-anchor="middle" font-size="14" fill="#111" font-weight="bold">about 340 s</text><text x="794" y="98" text-anchor="middle" font-size="13" fill="#111">toleration expires, eviction</text><circle cx="840" cy="130" r="6" fill="#3b6fd4"/><text x="805" y="190" text-anchor="middle" font-size="14" fill="#111" font-weight="bold">361 s</text><text x="805" y="208" text-anchor="middle" font-size="13" fill="#111">new pods Ready (measured)</text><text x="450" y="230" text-anchor="middle" font-size="13" fill="#a33">The 120 s target was missed because the default eviction delay alone is 300 s.</text></svg>